# PhishTrace configuration (non-secret settings only)
# API keys live in .env -- never in this file.

host: 127.0.0.1          # set 0.0.0.0 only after enabling auth + session secret
port: 8088
data_dir: data
retention_days: 180
log_level: INFO

auth:
  enabled: true
  session_ttl_hours: 12
  cookie_secure: false     # set true when served over TLS
  csrf: true
  login_max_attempts: 8
  login_window_seconds: 300
  allow_registration: false

limits:
  max_depth: 3
  max_children_per_node: 25
  max_nodes: 500
  global_request_budget: 400
  per_provider_budget: 60
  path_confidence_floor: 0.25
  min_edge_confidence: 0.15
  expand_weak: false          # weak selectors are context-only by default
  expand_medium: true
  max_retries: 2
  retry_backoff_seconds: 0.7
  investigation_timeout_seconds: 900
  provider_timeout_seconds: 45
  max_sightings: 20
  archive_sightings: true
  max_archive_snapshots: 20

fetcher:
  active_fetch: false       # deliberate opt-in for contacting attacker infrastructure
  proxy: null               # e.g. socks5://127.0.0.1:9050 or http://vps-egress:8080
  timeout: 12
  max_bytes: 3000000
  max_total_bytes: 20000000
  max_redirects: 5
  verify_tls: true
  drop_privileges: true
  restricted_user: nobody
  allow_localhost: false    # test-only switch for the local mock kit
  max_assets: 25

stoplists:
  cdn_ips: config/stoplists/cdn_ips.txt
  shared_hosting_ips: config/stoplists/shared_hosting_ips.txt
  parking_nameservers: config/stoplists/parking_nameservers.txt
  privacy_registrants: config/stoplists/privacy_registrants.txt
  big_brand_certs: config/stoplists/big_brand_certs.txt
  benign_domains: config/stoplists/benign_domains.txt

reports:
  company: PhishTrace
  formats: [html, pdf, json, stix, md, txt, csv]
  tlp: CLEAR                # report marking: CLEAR | GREEN | AMBER | AMBER+STRICT | RED
  cert_contacts: {}          # optional: {"NG": "cert@example.gov.ng", "US": "..."} by ISO-3166 alpha-2
  # Abuse package recipients. Addresses are never guessed: map the roles/ASNs
  # you have verified. Unmapped targets are listed for manual review.
  abuse_contacts: {}         # {registrar: "abuse@registrar.example", hosting: "...", platform: "..."}
  hosting_contacts: {}       # {"AS13335": "abuse@cloudflare.example", "Some Hosting LLC": "..."}
  from_address: "phishtrace@localhost"
  reply_to: ""
  abuse_include_attachment: true
  opencti:
    enabled: false
    url: ""
    token_env: OPENCTI_TOKEN
    verify_tls: true
    timeout: 30
  misp:
    enabled: false
    url: ""
    key_env: MISP_API_KEY
    verify_tls: true
    timeout: 30
  llm_proxy:
    enabled: false
    endpoint: ""
    model: ""
    api_key_env: AI_API_KEY
  # light-weight optional classifier (disabled by default)
  llm_classifier:
    enabled: false
    provider: openai
    model: ""

providers:
  # ---- Phase A: no API key required ---------------------------------------
  crtsh:        { enabled: true }
  urlscan:      { enabled: true }
  urlscan_search: { enabled: true }
  dns:          { enabled: true }
  http_fingerprint: { enabled: true }
  urlhaus:      { enabled: true }
  threatfox:    { enabled: true }
  openphish:    { enabled: true }
  phishing_database: { enabled: true }
  phishtank:    { enabled: true }   # needs a free API key, skipped without one
  wayback:      { enabled: true }
  archive_today: { enabled: true }
  memento:      { enabled: true }
  commoncrawl:  { enabled: true }
  certspotter:  { enabled: true }
  hackertarget: { enabled: true }
  threatminer:  { enabled: true }
  phishstats:   { enabled: true }
  shodan_internetdb: { enabled: true }
  ipinfo:       { enabled: true }
  hudsonrock:   { enabled: true }
  favicon:      { enabled: true }
  jarm:         { enabled: true }
  typosquat:    { enabled: true }
  dns_axfr:     { enabled: false }
  shodan:       { enabled: true }
  censys:       { enabled: true }
  securitytrails: { enabled: true }
  virustotal:   { enabled: true }
  alienvault_otx: { enabled: true }
  abuseipdb:    { enabled: true }
  greynoise:    { enabled: true }
  hybrid_analysis: { enabled: true }
  malwarebazaar: { enabled: true }
  misp:         { enabled: true }
  opencti:      { enabled: true }
  telegram:     { enabled: true }
  spiderfoot:   { enabled: true, options: { mode: cli, cli_path: "", rest_url: "", modules: "sfp_dnsresolve,sfp_crt,sfp_whois,sfp_urlscan,sfp_virustotal,sfp_otx,sfp_haveibeenpwned" } }
  theharvester: { enabled: true }
  holehe:       { enabled: true }
  maigret:      { enabled: true }
  sherlock:     { enabled: true }
  phoneinfoga:  { enabled: true }
  ghunt:        { enabled: true }
  dnstwist:     { enabled: true }
  # breach providers disabled by default -- legal review required
  dehashed:     { enabled: false, options: { legal_acknowledged: false } }
  intelx:       { enabled: true }
  # ---- Phase B / C keyed or wrapped tools (skip cleanly without keys) ----
  youtube:      { enabled: true }
  x_search:     { enabled: true }
  reddit:       { enabled: true }
  bluesky:      { enabled: true }
  mastodon:     { enabled: true }
  serpapi:      { enabled: true }
  brave_search: { enabled: true }
  google_cse:   { enabled: true }
  rdap:         { enabled: true }
  whoisxml:     { enabled: true }
  domaintools:  { enabled: true }
  securitytrails_dns: { enabled: false }
  validin:      { enabled: true }
  silentpush:   { enabled: true }
  netlas:       { enabled: true }
  criminalip:   { enabled: true }
  greynoise_ri: { enabled: true }
