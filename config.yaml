# PhishTrace configuration (non-secret settings only)
# API keys live in .env -- never in this file.

host: 127.0.0.1          # set 0.0.0.0 only after enabling auth + session secret
port: 8088
data_dir: data
retention_days: 180
log_level: INFO

auth:
  enabled: true
  session_ttl_hours: 12
  cookie_secure: false     # set true when served over TLS
  csrf: true
  login_max_attempts: 8
  login_window_seconds: 300
  allow_registration: false

limits:
  max_depth: 3
  max_children_per_node: 25
  max_nodes: 500
  global_request_budget: 400
  per_provider_budget: 60
  path_confidence_floor: 0.25
  min_edge_confidence: 0.15
  expand_weak: false          # weak selectors are context-only by default
  expand_medium: true
  max_retries: 2
  retry_backoff_seconds: 0.7
  investigation_timeout_seconds: 900
  provider_timeout_seconds: 45
  max_sightings: 20
  archive_sightings: true
  max_archive_snapshots: 20

fetcher:
  active_fetch: false       # deliberate opt-in for contacting attacker infrastructure
  proxy: null               # e.g. socks5://127.0.0.1:9050 or http://vps-egress:8080
  timeout: 12
  max_bytes: 3000000
  max_total_bytes: 20000000
  max_redirects: 5
  verify_tls: true
  drop_privileges: true
  restricted_user: nobody
  allow_localhost: false    # test-only switch for the local mock kit
  max_assets: 25

stoplists:
  cdn_ips: config/stoplists/cdn_ips.txt
  shared_hosting_ips: config/stoplists/shared_hosting_ips.txt
  parking_nameservers: config/stoplists/parking_nameservers.txt
  privacy_registrants: config/stoplists/privacy_registrants.txt
  big_brand_certs: config/stoplists/big_brand_certs.txt
  benign_domains: config/stoplists/benign_domains.txt

reports:
  company: PhishTrace
  formats: [html, pdf, json, stix, md, txt, csv]
  tlp: CLEAR                # report marking: CLEAR | GREEN | AMBER | AMBER+STRICT | RED
  cert_contacts: {}          # optional: {"NG": "cert@example.gov.ng", "US": "..."} by ISO-3166 alpha-2
  # Abuse package recipients. Addresses are never guessed: map the roles/ASNs
  # you have verified. Unmapped targets are listed for manual review.
  abuse_contacts: {}         # {registrar: "abuse@registrar.example", hosting: "...", platform: "..."}
  hosting_contacts: {}       # {"AS13335": "abuse@cloudflare.example", "Some Hosting LLC": "..."}
  from_address: "phishtrace@localhost"
  reply_to: ""
  abuse_include_attachment: true
  opencti:
    enabled: false
    url: ""
    token_env: OPENCTI_TOKEN
    verify_tls: true
    timeout: 30
  misp:
    enabled: false
    url: ""
    key_env: MISP_API_KEY
    verify_tls: true
    timeout: 30
  llm_proxy:
    enabled: false
    endpoint: ""
    model: ""
    api_key_env: AI_API_KEY
  # light-weight optional classifier (disabled by default)
  llm_classifier:
    enabled: false
    provider: openai
    model: ""

providers:
  # ---- Phase A: keyless sources -------------------------------------------
  # Everything listed here is implemented; a source that needs a key or a
  # binary still runs, but the registry reports it as "skipped" with a reason.
  crt_sh:        { enabled: true }
  urlscan:       { enabled: true }
  urlhaus:       { enabled: true }
  threatfox:     { enabled: true }
  openphish:     { enabled: true }
  phishing_database: { enabled: true }
  phishtank:     { enabled: true }   # free key: PHISHTANK_API_KEY, skipped without one
  wayback:       { enabled: true }
  memento:       { enabled: true }
  certspotter:   { enabled: true }
  hackertarget:  { enabled: true }
  threatminer:   { enabled: true }
  phishstats:    { enabled: true }
  shodan_internetdb: { enabled: true }
  ipinfo:        { enabled: true }
  hudsonrock:    { enabled: true }
  typosquat:     { enabled: true }
  dns_intel:     { enabled: true }
  rdap:          { enabled: true }
  telegram_public: { enabled: true }
  reddit:        { enabled: true }
  bluesky:       { enabled: true }
  mastodon:      { enabled: true }

  # ---- Phase B: keyed APIs ------------------------------------------------
  # A provider stays inert until its variable is present in .env; the report
  # coverage section then shows which sources could not be consulted.
  virustotal:    { enabled: true, timeout: 45 }
  shodan:        { enabled: true, timeout: 45 }
  censys:        { enabled: true, timeout: 45 }
  securitytrails: { enabled: true, timeout: 30 }
  whoisxml:      { enabled: true, timeout: 30 }
  alienvault_otx: { enabled: true, timeout: 30 }
  abuseipdb:     { enabled: true, timeout: 30 }
  greynoise:     { enabled: true, timeout: 30 }
  hybrid_analysis: { enabled: true, timeout: 45 }
  malwarebazaar: { enabled: true, timeout: 30 }   # anonymous works; MALWAREBAZAAR_API_KEY raises limits

  # ---- Phase C: wrapped CLI tools -----------------------------------------
  # `path` is optional: without it the binary must be on PATH.  `timeout` is
  # enforced by the runner together with a hard stdout/stderr byte cap.
  dnstwist:      { enabled: true, timeout: 300, options: { path: "C:/Users/Administrator/PhishTrace/.tools/dnstwist/Scripts/dnstwist.exe", max_output: 4000000 } }
  theharvester:  { enabled: true, timeout: 300, options: { path: "C:/Users/Administrator/PhishTrace/.tools/osint/Scripts/theHarvester.exe", sources: "crtsh,hackertarget", limit: 200 } }
  spiderfoot:    { enabled: true, timeout: 600, options: { path: "", mode: cli, modules: "sfp_dnsresolve,sfp_crt,sfp_whois" } }
  sherlock:      { enabled: true, timeout: 300, options: { path: "C:/Users/Administrator/PhishTrace/.tools/osint/Scripts/sherlock.exe" } }
  maigret:       { enabled: true, timeout: 300, options: { path: "C:/Users/Administrator/PhishTrace/.tools/osint/Scripts/maigret.exe" } }
  phoneinfoga:   { enabled: true, timeout: 120, options: { path: "C:/Users/Administrator/PhishTrace/.tools/bin/phoneinfoga.exe" } }
  # Active account probes: stay off until an operator records scope sign-off.
  holehe:        { enabled: false, options: { path: "C:/Users/Administrator/PhishTrace/.tools/osint/Scripts/holehe.exe", legal_acknowledged: false } }
  ghunt:         { enabled: false, options: { path: "", cookies: "", legal_acknowledged: false } }

  # ---- Planned, not implemented -------------------------------------------
  # These names are accepted in config.yaml (no error) but no plugin exists yet;
  # docs/PROVIDERS.md tracks them.  Keep keys in .env for the day they land.
  # search: youtube, x_search, serpapi, brave_search, google_cse, shodan_search
  # feeds: domaintools, validin, silentpush, netlas, criminalip, greynoise_ri
  # breach: dehashed, intelx  (legal review required before enabling)
  # integrations: misp, opencti, telegram
